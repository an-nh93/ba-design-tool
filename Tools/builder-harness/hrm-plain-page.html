<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sample plain page</title>
<style>
    body { margin: 0; background: #f4f6f9; font: 13px Arial, sans-serif; color: #333333; }
    a { text-decoration: none; }
    p { margin: 0; }
    .card { width: 900px; margin: 10px; padding: 16px; box-sizing: border-box; background: #ffffff; }
    .row { display: flex; align-items: center; column-gap: 12px; height: 40px; margin-bottom: 12px; }
    .strip { display: flex; align-items: center; height: 44px; margin-bottom: 12px; padding: 0 10px; background: #e9eef5; }
    .reload { display: flex; align-items: center; column-gap: 6px; padding: 8px 14px; border: 1px solid #eceef2; border-radius: 4px; color: #0a75ba; }
    .mark { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #0a75ba; }
    .btn { height: 32px; padding: 0 16px; border: 1px solid #dee2e6; border-radius: 4px; font: inherit; }
    .btn-remove { background: #eceef2; color: #b0b9c9; }
    .btn-export { border-color: #0a75ba; background: #ffffff; color: #0a75ba; }
    .btn-fill { border: 0; background: #1b7f3b; color: #ffffff; }
    .btn-plain { display: inline-block; height: auto; padding: 8px 14px; border: 0; background: transparent; color: #1f2d3d; }
    .deactive-event { pointer-events: none; }
    .list { width: 868px; border-collapse: collapse; }
    .list th, .list td { height: 30px; padding: 0 8px; border-bottom: 1px solid #e4e7ec; text-align: left; }
    .list .tick { width: 50px; }
</style>
</head>
<body>
<div class="card">
    <div class="row">
        <a id="btnLoad" class="reload deactive-event" href="#"><span class="mark"></span><p>Load selected items</p></a>
        <button type="button" id="btnRemove" class="btn btn-remove deactive-event">Remove</button>
        <button type="button" id="btnExport" class="btn btn-export">Export</button>
        <button type="button" id="btnFill" class="btn btn-fill">Approve</button>
        <button type="button" id="btnLocked" class="btn btn-export" disabled>Locked</button>
    </div>
    <div class="strip"><a id="btnPlain" class="btn btn-plain" href="#">Advanced search</a></div>
    <table class="list" id="tblItems">
        <thead><tr><th class="tick"></th><th>Code</th><th>Name</th></tr></thead>
        <tbody><tr><td></td><td>A01</td><td>First item</td></tr></tbody>
    </table>
</div>
</body>
</html>
